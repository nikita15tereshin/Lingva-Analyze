version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lingva_postgres
    environment:
      POSTGRES_USER: lingva_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lingva_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
